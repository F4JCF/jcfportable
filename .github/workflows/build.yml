name: Construction Linux et Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc 2.35 : compatible Linux Mint 21 et 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y libhamlib-utils patchelf libxcb-cursor0 libegl1 \
            libxkbcommon-x11-0 libfuse2 wget

      - name: Dépendances Python
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Construction
        run: bash packaging/build_linux.sh

      - name: Vérification du lancement (sans écran)
        run: |
          export QT_QPA_PLATFORM=offscreen
          timeout 15 ./dist/jcfportable/jcfportable & sleep 10; kill %1 2>/dev/null || true
          ./build/AppDir/usr/bin/rigctl -l | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: JCFPortable-linux
          path: out/*

  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Construction
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Vérification du lancement (sans écran)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -PassThru dist/jcfportable/jcfportable.exe
          Start-Sleep 10
          if ($p.HasExited) { throw "Le programme s'est arrêté au démarrage (code $($p.ExitCode))" }
          Stop-Process $p
          $e = Get-ChildItem out/*-windows.exe | Select-Object -First 1
          $q = Start-Process -PassThru $e.FullName
          Start-Sleep 20
          if ($q.HasExited) { throw "L'exe unique s'est arrêté au démarrage (code $($q.ExitCode))" }
          Stop-Process $q

      - uses: actions/upload-artifact@v4
        with:
          name: JCFPortable-windows
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
